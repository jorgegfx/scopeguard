[project]
name = "scopeguard"
version = "0.1.0"
description = "Multi-agent penetration-testing orchestrator with authorization-first scope enforcement"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "fpdf2>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
scopeguard = "orchestrator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/orchestrator",
    "src/scope",
    "src/agents",
    "src/tools",
    "src/audit",
    "src/llm",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
