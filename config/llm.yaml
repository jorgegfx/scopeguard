base_url: "http://localhost:1234/v1"
model: "qwen/qwen3-14"

agents:
  recon:
    temperature: 0.1
    max_context_tokens: 8192
  service_enum:
    temperature: 0.1
    max_context_tokens: 8192
  vuln_scan:
    temperature: 0.1
    max_context_tokens: 8192
  webapp:
    temperature: 0.2
    max_context_tokens: 8192
  report:
    temperature: 0.3
    max_context_tokens: 16384
  service_tester:
    temperature: 0.1
    max_context_tokens: 8192
    # Hard cap on tool-call round-trips per service branch -- independent of
    # any instruction in the prompt, so a model that ignores "finish up" or
    # gets stuck alternating tool calls can't loop indefinitely.
    max_tool_calls: 6

concurrency:
  max_concurrent_requests: 2
