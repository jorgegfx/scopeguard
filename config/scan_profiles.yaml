passive:
  description: "Read-only recon; no active packets beyond standard DNS/WHOIS lookups"
  allowed_categories: ["passive_recon"]
  max_concurrent_branches: 20
  rate_limit_per_target_rps: 5

recon_only:
  description: "Active port/service discovery (nmap) but no vuln scanning or web-app testing"
  allowed_categories: ["passive_recon", "port_scan", "service_enum"]
  max_concurrent_branches: 10
  rate_limit_per_target_rps: 3

active:
  description: "Full authorized testing: vuln scanning, web-app testing and webshell/backdoor detection, still no exploitation"
  allowed_categories: ["passive_recon", "port_scan", "service_enum", "vuln_scan", "webapp_test", "webshell_scan"]
  max_concurrent_branches: 4
  rate_limit_per_target_rps: 1

active_plus_content:
  description: "As 'active', plus directory/path content discovery (noisier -- more requests per host)"
  allowed_categories: ["passive_recon", "port_scan", "service_enum", "vuln_scan", "webapp_test", "webshell_scan", "content_discovery"]
  max_concurrent_branches: 2
  rate_limit_per_target_rps: 1

# Opt-in exploitation profile. Metasploit modules only run when a run explicitly
# selects this profile AND the scope record lists aux_scan / exploit in its
# allowed_categories -- both gates must be open. Deliberately the tightest caps
# in the file: exploitation is single-branch and slow-throttled by default so a
# module run can't fan out into something that looks like a DoS. Keep aux_scan
# and exploit OUT of the other profiles so they never enable by accident.
active_exploit:
  description: "Active exploitation via Metasploit (auxiliary + exploit modules) -- opt-in, heavily gated; requires matching scope authorization"
  allowed_categories: ["passive_recon", "port_scan", "service_enum", "vuln_scan", "webapp_test", "webshell_scan", "content_discovery", "aux_scan", "exploit"]
  max_concurrent_branches: 1
  rate_limit_per_target_rps: 1
